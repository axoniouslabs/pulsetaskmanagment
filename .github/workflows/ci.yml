name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_MODE: "1"
      SEED_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
