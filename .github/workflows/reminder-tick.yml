# Backup scheduler for the reminder engine. GitHub runs scheduled jobs at most
# every 5 minutes and sometimes late, so use cron-job.org (every minute) as the
# main trigger and keep this as a safety net. Needs two repository secrets:
#   PULSE_URL    e.g. https://pulse-yourcompany.vercel.app
#   CRON_SECRET  the same value as in Vercel
name: Reminder engine tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tick
        env:
          PULSE_URL: ${{ secrets.PULSE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PULSE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "PULSE_URL / CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$PULSE_URL/api/cron/tick"
